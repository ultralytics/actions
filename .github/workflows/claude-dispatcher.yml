name: Claude Dispatcher

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Target repo (owner/name)"
        required: true
      prompt:
        description: "Task to implement"
        required: true

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repo }}
          token: ${{ secrets._GITHUB_TOKEN }}

      - run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets._GITHUB_TOKEN }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          unset ANTHROPIC_API_KEY
          TASK="$(printf '%s\n' \
            "Use gh to gather any referenced issue or PR context." \
            "Implement the task in this repository, but do not commit, push, or open a PR." \
            "$PROMPT")"
          claude -p "$TASK" --allowedTools "Read,Edit,Write,Glob,Grep,Bash"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets._GITHUB_TOKEN }}
          REPO: ${{ inputs.repo }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          git status --porcelain | grep -q . || exit 0
          BRANCH="claude/${GITHUB_RUN_ID}"
          TITLE="$(printf '%s' "$PROMPT" | tr '\n' ' ' | cut -c1-100)"
          git config user.name "UltralyticsAssistant"
          git config user.email "web@ultralytics.com"
          git switch -c "$BRANCH"
          git add -A
          git commit -m "Claude: $TITLE"
          git push origin "$BRANCH"
          gh pr create --repo "$REPO" --head "$BRANCH" --title "Claude: $TITLE" --body "$PROMPT"
