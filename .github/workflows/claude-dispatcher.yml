name: Claude Dispatcher

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Target repo (owner/name)"
        required: true
      prompt:
        description: "Task to implement"
        required: true

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repo }}
          token: ${{ secrets._GITHUB_TOKEN }}
          persist-credentials: false

      - run: npm install -g @anthropic-ai/claude-code@2.1.218

      - name: Run Claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          unset ANTHROPIC_API_KEY
          claude -p "Implement this task without committing, pushing, or opening a PR: $PROMPT" \
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets._GITHUB_TOKEN }}
          REPO: ${{ inputs.repo }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            exit 0
          fi
          BRANCH="claude/${GITHUB_RUN_ID}"
          TITLE="$(printf '%s' "$PROMPT" | tr '\n' ' ' | cut -c1-100)"
          git config user.name "UltralyticsAssistant"
          git config user.email "web@ultralytics.com"
          git switch -c "$BRANCH"
          git add -A
          git commit -m "Claude: $TITLE"
          gh auth setup-git
          git push origin "$BRANCH"
          gh pr create --repo "$REPO" --head "$BRANCH" --title "Claude: $TITLE" --body "$PROMPT"
