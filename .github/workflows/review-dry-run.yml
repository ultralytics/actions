# TEMPORARY: dry-run the PR review agent against any PR (no posting) to validate large-diff robustness

name: Review Dry Run

on:
  push:
    branches: [review-large-pr-robustness]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ultralytics/actions/setup-uv@main
      - run: uv pip install --system -e .
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPO: ultralytics/sdk
          PR: "24"
        run: |
          python - <<'PY'
          import json, os
          from actions.review_pr import generate_pr_review
          from actions.utils.github_utils import Action
          repo, pr = os.environ["REPO"], int(os.environ["PR"])
          event = Action(event_name="pull_request", event_data={"repository": {"full_name": repo}, "pull_request": {"number": pr}})
          info = event.get(f"https://api.github.com/repos/{repo}/pulls/{pr}").json()
          diff, head_sha = event.get_pr_diff_snapshot()
          print(f"diff chars={len(diff[0])} lines={diff[0].count(chr(10))} skipped={len(diff[1])}")
          review = generate_pr_review(repo, diff, info.get("title") or "", info.get("body") or "", event, head_sha, {})
          review.pop("diff_files", None)
          print(json.dumps(review, indent=2))
          PY
