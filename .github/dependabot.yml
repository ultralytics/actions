# Dependabot for package version updates
# https://docs.github.com/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      time: "04:00"
    open-pull-requests-limit: 3
    labels:
      - dependencies

  - package-ecosystem: github-actions
    # "/" covers /.github/workflows and the root action.yml; each sub-action's action.yml needs its own directory
    directories: ["/", "/cla", "/cleanup-disk", "/dependabot", "/failure-alert", "/github-report", "/retry", "/setup-uv"]
    schedule:
      interval: weekly
      time: "04:00"
    open-pull-requests-limit: 3
    labels:
      - dependencies
