name: "Dependabot"
author: "Ultralytics"
description: "Update GitHub Actions versions across organization repos with cached lookups. A centralized alternative to per-repo Dependabot configuration."
branding:
  icon: "refresh-cw"
  color: "blue"
inputs:
  token:
    description: "GitHub token with contents:write, pull-requests:write, and workflow permissions"
    required: true
  org:
    description: "GitHub organization name"
    required: false
    default: "ultralytics"
  public:
    description: "Scan public repositories"
    required: false
    default: "true"
  private:
    description: "Scan private repositories"
    required: false
    default: "true"
  internal:
    description: "Scan internal repositories"
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - uses: ultralytics/actions/setup-uv@main

    - name: Install ultralytics-actions
      env:
        ACTION_PATH: ${{ github.action_path }}/..
      run: |
        echo "::group::Install ultralytics-actions"
        package_dir=$(mktemp -d "$RUNNER_TEMP/ultralytics-actions.XXXXXX")
        uv build --wheel "$ACTION_PATH" --out-dir "$package_dir"
        if [ "$(uname)" = "Darwin" ]; then
          uv pip install --system --break-system-packages "$package_dir"/*.whl
        else
          sudo env "PATH=$PATH" uv pip install --system --break-system-packages "$package_dir"/*.whl
        fi
        echo "::endgroup::"
      shell: bash

    - name: Dependabot
      env:
        GH_TOKEN: ${{ inputs.token }}
        ORG: ${{ inputs.org }}
        PUBLIC: ${{ inputs.public }}
        PRIVATE: ${{ inputs.private }}
        INTERNAL: ${{ inputs.internal }}
      run: |
        echo "::group::Dependabot"
        python -m actions.dependabot
        echo "::endgroup::"
      shell: bash
